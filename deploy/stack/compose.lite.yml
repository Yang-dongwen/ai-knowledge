# 生产默认（2G 小机）：web + okx-bot
#
# 密钥不在本文件写死路径。server-deploy / up.sh 会生成临时 override：
#   services.okx-bot.env_file = <绝对路径>/deploy/env/app.env
#
# 手动:
#   export APP_ENV_FILE=$PWD/deploy/env/app.env
#   printf 'services:\n  okx-bot:\n    env_file:\n      - %s\n' "$APP_ENV_FILE" > /tmp/ae-env.override.yml
#   docker compose -f deploy/stack/compose.lite.yml -f /tmp/ae-env.override.yml \
#     --env-file deploy/env/app.env up -d --build
#
# build.context 相对本文件目录 deploy/stack/ → 仓库根

name: auto-exchange-lite

services:
  okx-bot:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.okx-bot
    restart: unless-stopped
    # env_file 由 override 注入绝对路径（勿在此写相对路径）
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      JAVA_OPTS: ${JAVA_OPTS:--Xmx640m}
    volumes:
      - /data/auto-exchange/logs:/app/logs
      - /data/auto-exchange/data:/app/data
    networks:
      - appnet
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 900M

  web:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    depends_on:
      - okx-bot
    networks:
      - appnet

  # Cloudflare Quick Tunnel：免费 *.trycloudflare.com，无需域名
  # 开启: QUICK_TUNNEL=1（默认开启，2G 额外约 30MB）
  # 看地址: bash deploy/scripts/quick-tunnel-url.sh
  # 注意: 每次容器重建 URL 会变（临时隧道特性）
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://web:80
    depends_on:
      - web
    networks:
      - appnet
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  appnet:
    driver: bridge

