# 生产默认（2G 小机）：web + okx-bot
#
# env_file 必须用绝对路径（经 APP_ENV_FILE 注入），避免相对路径在
# compose 目录 / project 目录 / cwd 之间解析不一致。
#
# 在仓库根（由 server-deploy / up.sh 设置 APP_ENV_FILE）:
#   export APP_ENV_FILE=$PWD/deploy/env/app.env
#   docker compose -f deploy/stack/compose.lite.yml --env-file deploy/env/app.env up -d --build
#
# build.context 相对本文件所在目录 deploy/stack/ → 仓库根

name: auto-exchange-lite

services:
  okx-bot:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.okx-bot
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?set APP_ENV_FILE to absolute path of deploy/env/app.env}
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      JAVA_OPTS: ${JAVA_OPTS:--Xmx640m}
    volumes:
      - /data/auto-exchange/logs:/app/logs
      - /data/auto-exchange/data:/app/data
    networks:
      - appnet
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 900M

  web:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    depends_on:
      - okx-bot
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
