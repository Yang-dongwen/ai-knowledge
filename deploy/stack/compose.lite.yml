# 生产默认（2G 小机）：web + okx-bot
# 密钥：deploy/env/app.env
# profile：ec2（jar 内 application-ec2.yml）
#
# 必须在仓库根目录执行，或显式指定 --project-directory <仓库根>：
#   docker compose --project-directory . \
#     -f deploy/stack/compose.lite.yml \
#     --env-file deploy/env/app.env \
#     up -d --build
#
# 本文件内所有相对路径均相对于「仓库根」。

name: auto-exchange-lite

services:
  okx-bot:
    build:
      context: .
      dockerfile: deploy/stack/Dockerfile.okx-bot
    restart: unless-stopped
    env_file:
      - deploy/env/app.env
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      JAVA_OPTS: ${JAVA_OPTS:--Xmx640m}
    volumes:
      - /data/auto-exchange/logs:/app/logs
      - /data/auto-exchange/data:/app/data
    networks:
      - appnet
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 900M

  web:
    build:
      context: .
      dockerfile: deploy/stack/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    depends_on:
      - okx-bot
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
