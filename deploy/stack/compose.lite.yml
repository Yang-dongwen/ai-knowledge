# 生产默认（2G 小机）：web + okx-bot + caddy(80/443)
#
# 密钥：server-deploy 生成 env override
# 域名: https://dwcode.cloud （Caddy 自动证书）
# 备用: http://公网IP:8088 （直连 web，无证书）
#
# Cloudflare Tunnel（profile: tunnel）:
#   bash deploy/scripts/quick-tunnel.sh start

name: auto-exchange-lite

services:
  okx-bot:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.okx-bot
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      JAVA_OPTS: ${JAVA_OPTS:--Xmx640m}
    volumes:
      - /data/auto-exchange/logs:/app/logs
      - /data/auto-exchange/data:/app/data
    networks:
      - appnet
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 900M

  web:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.web
    restart: unless-stopped
    # 仅内网给 caddy；另映射 8088 作备用/直连
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    expose:
      - "80"
    depends_on:
      - okx-bot
    networks:
      - appnet

  # 80/443：自动 HTTPS，反代 web
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - appnet
    deploy:
      resources:
        limits:
          memory: 64M

  # cloudflared；command 可由 quick/named 脚本 override
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://web:80
    depends_on:
      - web
    networks:
      - appnet
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  appnet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
