# 生产默认（2G 小机）：web + okx-bot
#
# 密钥不在本文件写死路径。server-deploy / up.sh 会生成临时 override：
#   services.okx-bot.env_file = <绝对路径>/deploy/env/app.env
#
# Cloudflare Tunnel（profile: tunnel）:
#   固定域名: bash deploy/scripts/named-tunnel.sh setup <fqdn>
#   临时域名: bash deploy/scripts/quick-tunnel.sh start

name: auto-exchange-lite

services:
  okx-bot:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.okx-bot
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      JAVA_OPTS: ${JAVA_OPTS:--Xmx640m}
    volumes:
      - /data/auto-exchange/logs:/app/logs
      - /data/auto-exchange/data:/app/data
    networks:
      - appnet
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 900M

  web:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    depends_on:
      - okx-bot
    networks:
      - appnet

  # cloudflared 镜像无 shell；command 由 named/quick 脚本写的 tunnel.override.yml 决定
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    # 默认 quick；named-tunnel.sh 会用 override 改成 config run
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://web:80
    depends_on:
      - web
    networks:
      - appnet
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  appnet:
    driver: bridge
