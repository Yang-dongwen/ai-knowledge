# 生产默认（2G 小机）：web + okx-bot
# 本文件位于 deploy/stack/，下列相对路径均相对「本文件所在目录」
#   ../env/app.env          → deploy/env/app.env
#   context: ../..          → 仓库根
#   dockerfile 相对 context
#
# 在仓库根执行:
#   docker compose -f deploy/stack/compose.lite.yml --env-file deploy/env/app.env up -d --build
#
# 注意: --env-file 只做 compose 变量插值；注入容器靠下方 env_file

name: auto-exchange-lite

services:
  okx-bot:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.okx-bot
    restart: unless-stopped
    env_file:
      - ../env/app.env
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      JAVA_OPTS: ${JAVA_OPTS:--Xmx640m}
    volumes:
      - /data/auto-exchange/logs:/app/logs
      - /data/auto-exchange/data:/app/data
    networks:
      - appnet
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 900M

  web:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    depends_on:
      - okx-bot
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
