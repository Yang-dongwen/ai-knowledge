# 全量栈：web + okx-bot + whisper + remotion（建议 ≥ 8GB）
# 路径均相对本文件所在目录 deploy/stack/
#
#   docker compose -f deploy/stack/compose.full.yml --env-file deploy/env/app.env up -d --build

name: auto-exchange

services:
  okx-bot:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.okx-bot
    restart: unless-stopped
    env_file:
      - ../env/app.env
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      VIDEO_WHISPER_MANAGED_ENABLED: "false"
      AIGEN_REMOTION_MANAGE_PROCESS: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1536m}
    volumes:
      - app-data:/app/data
    depends_on:
      whisper:
        condition: service_started
      remotion:
        condition: service_started
    networks:
      - appnet
    expose:
      - "8080"

  whisper:
    build:
      context: ../../okx-bot/whisper-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
    volumes:
      - whisper-cache:/root/.cache
    networks:
      - appnet
    expose:
      - "8000"

  remotion:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.remotion
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      ALLOWED_WORK_ROOT: /app/data
      AIGEN_RENDER_TOKEN: ${AIGEN_RENDER_TOKEN:-}
      MAX_CONCURRENT_RENDERS: "1"
    volumes:
      - app-data:/app/data
    networks:
      - appnet
    expose:
      - "3100"

  web:
    build:
      context: ../..
      dockerfile: deploy/stack/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - okx-bot
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  app-data:
  whisper-cache:
