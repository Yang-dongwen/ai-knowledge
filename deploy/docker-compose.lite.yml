# 2G 小机：web + okx-bot
# 配置：jar 内 application-ec2.yml（已提交，用变量）+ 服务器 deploy/app.env（真实密钥，不提交）
# 宿主机：/data/auto-exchange/{logs,data}

name: auto-exchange-lite

services:
  okx-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.okx-bot
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      JAVA_OPTS: ${JAVA_OPTS:--Xmx640m}
    volumes:
      - /data/auto-exchange/logs:/app/logs
      - /data/auto-exchange/data:/app/data
    networks:
      - appnet
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 900M

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    depends_on:
      - okx-bot
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
