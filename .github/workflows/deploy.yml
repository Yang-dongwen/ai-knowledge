# 一键部署：push main 或手动 Run workflow
# SSH → git pull → docker compose 重建
# 业务密钥只在服务器 deploy/env/app.env；此处仅 SSH 私钥

name: Deploy EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "okx-bot/doc/**"
      - ".grok/**"
      - "deploy/docs/**"
      - "deploy/README.md"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha)"
        required: false
        default: "main"
      compose_file:
        description: "Compose file"
        required: false
        default: "deploy/stack/compose.lite.yml"
      skip_git:
        description: "Skip git pull (1=only rebuild)"
        required: false
        default: "0"

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            APP_DIR='${{ secrets.DEPLOY_APP_DIR }}'
            if [ -z "$APP_DIR" ]; then APP_DIR="$HOME/auto-exchange"; fi
            REF='${{ github.event.inputs.ref }}'
            if [ -z "$REF" ]; then REF="main"; fi
            COMPOSE='${{ github.event.inputs.compose_file }}'
            if [ -z "$COMPOSE" ]; then COMPOSE="deploy/stack/compose.lite.yml"; fi
            SKIP_GIT='${{ github.event.inputs.skip_git }}'
            if [ -z "$SKIP_GIT" ]; then SKIP_GIT="0"; fi
            echo "APP_DIR=$APP_DIR REF=$REF COMPOSE=$COMPOSE SKIP_GIT=$SKIP_GIT"
            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR 不存在"
              exit 1
            fi
            if [ ! -f "$APP_DIR/deploy/scripts/server-deploy.sh" ]; then
              echo "ERROR: 缺少 server-deploy.sh。请先用本机 deploy-local.ps1 同步 deploy/ 目录"
              exit 1
            fi
            if [ "$SKIP_GIT" != "1" ] && [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: 尚未 git 化。在 EC2 执行: bash $APP_DIR/deploy/scripts/bootstrap-git.sh"
              echo "或临时用本机: pwsh deploy/scripts/deploy-local.ps1"
              exit 1
            fi
            # 兼容旧密钥路径：优先 env/app.env
            ENV_FILE="$APP_DIR/deploy/env/app.env"
            if [ ! -f "$ENV_FILE" ] && [ -f "$APP_DIR/deploy/app.env" ]; then
              ENV_FILE="$APP_DIR/deploy/app.env"
            elif [ ! -f "$ENV_FILE" ] && [ -f "$APP_DIR/deploy/.env" ]; then
              ENV_FILE="$APP_DIR/deploy/.env"
            fi
            export APP_DIR ENV_FILE COMPOSE_FILE="$COMPOSE" REF SKIP_GIT
            chmod +x "$APP_DIR/deploy/scripts/"*.sh || true
            bash "$APP_DIR/deploy/scripts/server-deploy.sh"
