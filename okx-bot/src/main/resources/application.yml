server:
  port: 8080

spring:
  profiles:
    active: paper
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/okx_bot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # 真实发信时取消注释并配置 SMTP；默认 console 模式见 auth.mail
  # mail:
  #   host: smtp.example.com
  #   port: 465
  #   username: your@email.com
  #   password: your-smtp-password
  #   properties:
  #     mail.smtp.auth: true
  #     mail.smtp.ssl.enable: true

# 认证 / JWT / 验证码 / 角色
auth:
  jwt:
    # 生产务必换成足够长的随机密钥（>=32 字节）
    secret: okx-bot-jwt-secret-change-me-in-production-2026-secure-key
    expire-seconds: 7200
    issuer: okx-bot
  mail:
    # true=验证码打印到后端日志，不真实发信（本地开发）
    console-mode: true
    from: noreply@example.com
  code:
    length: 6
    expire-minutes: 10
    send-interval-seconds: 60
    max-verify-fails: 10
    verify-fail-window-minutes: 15
  # 库中尚无 SUPER_ADMIN 时自动种子（首次启动）；上线后请改密或 seed-enabled: false
  admin:
    seed-enabled: true
    email: admin@okx-bot.local
    password: Admin@123456
    nickname: 超级管理员

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

okx:
  proxy-host: 127.0.0.1
  proxy-port: 7897

# AI 聊天配置（多供应商）
ai:
  default-provider: nvidia
  max-context-messages: 20
  # 聊天流式空闲超时（秒）：连续无 token 输出才中断；有输出可持续超过该时长
  response-timeout-seconds: 20
  # Chat 出站引擎：langchain4j（默认，Phase A）| okhttp（回滚手写客户端）
  # 影响：视频提取总结、aigen 分镜、imggen 润色、/video/models/test
  chat-engine: langchain4j
  providers:
    openai:
      name: OpenAI
      base-url: https://api.openai.com/v1
      api-key: ""
      # 模型改存库表 ai_model_config；此处 models 仅给聊天模块兜底，可为空
      models: []
    deepseek:
      name: DeepSeek
      base-url: https://api.deepseek.com/v1
      api-key: ""
      models: []
    # 供应商鉴权仍在此配置；模型列表改由数据库 ai_model_config 管理（前端「模型管理」）
    nvidia:
      name: NVIDIA NIM
      base-url: https://integrate.api.nvidia.com/v1
      api-key: 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
      models: []
    # openai / deepseek 的 models 也可清空，聊天模块若仍读 yml 可保留少量

# 视频核心内容提取（VideoCoreExtractor v2 持久化）
video:
  # 按 taskId 分目录：video/audio/transcription.json/summary.json
  work-dir: ./data/video
  # IDE 启动的 Java 进程可能读不到 winget 更新后的 PATH，建议写绝对路径
  yt-dlp-path: C:/Users/22809/AppData/Local/Microsoft/WinGet/Packages/yt-dlp.yt-dlp_Microsoft.Winget.Source_8wekyb3d8bbwe/yt-dlp.exe
  ffmpeg-path: C:/Users/22809/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-8.1.2-full_build/bin/ffmpeg.exe
  # v2 默认保留媒体与转录文件，便于前端查看/下载；磁盘紧张时可改 true
  cleanup-media: false
  whisper:
    base-url: http://127.0.0.1:8000
    # CPU 无独显：small 比 medium 快数倍；要更高精度可改 medium（更慢）
    model: small
    timeout-seconds: 600
    language: zh
    # Spring Boot 托管启动/停止本地 whisper-service（main.py）
    managed:
      enabled: true
      # 相对运行目录（IDE 一般是 okx-bot 根目录）
      working-dir: ./whisper-service
      # 空则自动用 .venv/Scripts/python.exe（Windows）或 .venv/bin/python
      python-path: ""
      host: 0.0.0.0
      # 空则从 base-url 取端口
      # port: 8000
      device: cpu
      compute: int8
      preload: true
      # 首次下载模型可能较慢
      startup-timeout-seconds: 300
      stop-timeout-seconds: 15
      # true= Whisper 起不来则整个应用启动失败
      fail-if-unavailable: false
  llm:
    # 复用上方 ai.providers；为空则用 ai.default-provider
    provider: nvidia
    model:
    temperature: 0.3
    # hybrid 总结字段多，过小易截断 chapters/导图/二创；SummarizationService 也会至少抬到 8192
    max-tokens: 8192
    # NVIDIA 免费档常 503 All workers are busy，自动退避重试
    max-retries: 5
    retry-backoff-ms: 3000
    retry-max-backoff-ms: 60000
    # 模型连通性测试超时（秒），超时直接判不可用
    test-timeout-seconds: 10
  download:
    max-duration-seconds: 7200
    audio-format: mp3
    timeout-seconds: 600
    # --- 下载加速（转录不需要 4K）---
    max-height: 720              # 最高 720p；改 480 更快，0=原画最慢
    concurrent-fragments: 8      # HLS/DASH 分片并发，可试 4~16
    prefer-merged: true          # 优先单文件流，减少双轨下载+合并
    # format: "best[height<=480]"  # 可选：完全自定义 yt-dlp -f，非空则覆盖上面规则
  # 多模态画面理解（默认 audio_only 兼容现网；go-live 可改 hybrid）
  understanding:
    mode: audio_only
    # true=不调云端 Omni，走 Mock 画面结果（联调用）
    mock: false
    # 任务用模型 ID 由前端选择（库表 capability=video_omni），以下 provider/model 仅作遗留兼容，运行时不再默认写入任务
    provider: nvidia
    model: ""
    # auto | nvidia-omni-chat | frame-vlm | mock — 模型未配 protocol 时的回退
    protocol: auto
    timeout-seconds: 600
    write-timeout-seconds: 120
    max-retries: 4
    max-request-video-seconds: 120
    short-max-seconds: 90
    medium-max-seconds: 600
    chunk-seconds: 90
    sample-stride-seconds: 60
    sample-window-seconds: 20
    target-height: 480
    target-fps: 2
    max-chunks-per-task: 20
    max-upload-bytes: 20971520
    fallback-to-audio: true
    fallback-frame-vlm: true
    cleanup-chunks: true
    enable-thinking: false
    thinking-token-budget: 1024
    hybrid-max-duration-seconds: 1800
    omni-max-duration-seconds: 1800
    on-omni-too-long: reject
    strip-audio-on-visual-chunks: true

# AI 视频生成 Phase 1
# mock-pipeline=true 时三步全 mock；false 时按 steps 切换
aigen:
  work-dir: ./data/aigen
  max-concurrent-tasks: 1
  mock-pipeline: false
  mock-step-delay-ms: 800
  cleanup-on-delete: true
  min-duration-sec: 5
  max-duration-sec: 90
  # visual=画面优先 Timeline；template=口播模板
  default-pipeline-mode: visual
  visual:
    min-shots: 4
    max-shots: 12
    image-concurrency: 2
    fail-on-shot-error: false
    default-audio-mode: bgm_only
    default-style-preset: cinematic-dark
    motion-default: ken_burns
    composition-id: VisualTimeline
    bgm-dir: ./data/aigen/_bgm
    image-steps: 4
    image-provider-key: nvidia
    default-enhance-image-prompt: false
  steps:
    plan: real          # real=调 LLM；mock=本地模板分镜/mock 导演
    asset: real         # real=出图或 TTS；mock=占位图/mock 音频
    render: real        # 需 aigen-remotion
  llm:
    provider: nvidia
    model:
    temperature: 0.5
    max-tokens: 8192
    max-retries: 3
    timeout-seconds: 120
    # Phase B：auto/json=response_format=json_object；off=关闭（仅文本）
    structured-mode: auto
    max-repair-attempts: 1
    log-prompts: false
  tts:
    # auto=优先 edge-tts CLI，否则 Windows SAPI；也可 edge / windows / mock
    provider: auto
    default-voice: zh-CN-XiaoxiaoNeural
    timeout-seconds: 120
    # 走系统 PATH 即可（已修复脏 PATH / WindowsApps 假 python 导致的解析失败）
    # 需 PATH 含：Python\Scripts（edge-tts）与 Python 安装目录
    edge-command: edge-tts
    edge-mode: auto          # auto | cli | python（auto 优先 CLI）
    python-path: python      # 仅 edge-mode=python 时用；auto 优先 edge-tts 命令
    fail-open-to-mock: false
    tail-padding-frames: 6
    # ffprobe-path: 空则尝试从 video.ffmpeg-path 推导
  remotion:
    base-url: http://127.0.0.1:3100
    timeout-seconds: 600
    codec: h264
    crf: 18
    render-token: ""
    # Java 托管 Node 渲染进程：随应用启停；端口已有健康服务则不重复启动
    manage-process: true
    auto-start-on-boot: true          # false=首次渲染时再启动
    project-dir: ../aigen-remotion    # 相对 okx-bot 运行目录；可改绝对路径
    node-path: node                   # 或 node.exe 绝对路径
    startup-timeout-seconds: 180      # 首次 bundle 可能较慢

# AI 文生图（NVIDIA FLUX）
# mock-pipeline=true 时全 mock；false 时按 steps 切换
imggen:
  enabled: true
  work-dir: ./data/imggen
  max-concurrent-tasks: 2
  mock-pipeline: false
  mock-step-delay-ms: 400
  cleanup-on-delete: true
  max-n: 4
  steps:
    enhance: real     # off | real | mock — 独立润色 API / 任务内润色；real=LlmChatClient
    generate: real    # real=NVIDIA FLUX；mock=本地渐变假图
  prompt-enhance:
    fallback-on-error: true
    provider:         # 空则 ai.default-provider
    model: ""
  flux:
    # 生图模型请在 DB 表 ai_model_config（capability=image）维护；此处仅 Adapter 兜底
    provider-key: nvidia
    invoke-url: https://ai.api.nvidia.com/v1/genai/black-forest-labs/flux.1-schnell
    model-path: black-forest-labs/flux.1-schnell
    default-steps: 4
    timeout-seconds: 180

logging:
  level:
    root: INFO
    com.dwcode.okxbot: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
