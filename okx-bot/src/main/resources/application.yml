server:
  port: 8080

spring:
  profiles:
    active: paper
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/okx_bot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

okx:
  proxy-host: 127.0.0.1
  proxy-port: 7897

# AI 聊天配置（多供应商）
ai:
  default-provider: nvidia
  max-context-messages: 20
  providers:
    openai:
      name: OpenAI
      base-url: https://api.openai.com/v1
      api-key: ""
      models:
        - id: gpt-4o-mini
          name: GPT-4o Mini
        - id: gpt-4o
          name: GPT-4o
    deepseek:
      name: DeepSeek
      base-url: https://api.deepseek.com/v1
      api-key: ""
      models:
        - id: deepseek-chat
          name: DeepSeek Chat
        - id: deepseek-reasoner
          name: DeepSeek R1
    # 模型来自 https://build.nvidia.com/models ，可按需增删
    nvidia:
      name: NVIDIA NIM
      base-url: https://integrate.api.nvidia.com/v1
      api-key: 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
      models:
        - id: deepseek-ai/deepseek-v4-flash
          name: DeepSeek V4 Flash（快）
        - id: deepseek-ai/deepseek-r1
          name: DeepSeek R1（强推理）
        - id: meta/llama-3.3-70b-instruct
          name: Llama 3.3 70B Instruct
        - id: meta/llama-3.1-8b-instruct
          name: Llama 3.1 8B Instruct（轻量）
        - id: nvidia/llama-3.1-nemotron-70b-instruct
          name: Nemotron 70B Instruct
        - id: qwen/qwen2.5-72b-instruct
          name: Qwen2.5 72B Instruct（中文强）
        - id: qwen/qwen2.5-7b-instruct
          name: Qwen2.5 7B Instruct
        - id: google/gemma-2-27b-it
          name: Gemma 2 27B
        - id: mistralai/mistral-small-24b-instruct
          name: Mistral Small 24B
        - id: microsoft/phi-4-mini-instruct
          name: Phi-4 Mini Instruct

# 视频核心内容提取（VideoCoreExtractor v2 持久化）
video:
  # 按 taskId 分目录：video/audio/transcription.json/summary.json
  work-dir: ./data/video
  # IDE 启动的 Java 进程可能读不到 winget 更新后的 PATH，建议写绝对路径
  yt-dlp-path: C:/Users/22809/AppData/Local/Microsoft/WinGet/Packages/yt-dlp.yt-dlp_Microsoft.Winget.Source_8wekyb3d8bbwe/yt-dlp.exe
  ffmpeg-path: C:/Users/22809/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-8.1.2-full_build/bin/ffmpeg.exe
  # v2 默认保留媒体与转录文件，便于前端查看/下载；磁盘紧张时可改 true
  cleanup-media: false
  whisper:
    base-url: http://127.0.0.1:8000
    # CPU 无独显：small 比 medium 快数倍；要更高精度可改 medium（更慢）
    model: small
    timeout-seconds: 600
    language: zh
  llm:
    # 复用上方 ai.providers；为空则用 ai.default-provider
    provider: nvidia
    model:
    temperature: 0.3
    max-tokens: 4096
    # NVIDIA 免费档常 503 All workers are busy，自动退避重试
    max-retries: 5
    retry-backoff-ms: 3000
    retry-max-backoff-ms: 60000
  download:
    max-duration-seconds: 7200
    audio-format: mp3
    timeout-seconds: 600
    # --- 下载加速（转录不需要 4K）---
    max-height: 720              # 最高 720p；改 480 更快，0=原画最慢
    concurrent-fragments: 8      # HLS/DASH 分片并发，可试 4~16
    prefer-merged: true          # 优先单文件流，减少双轨下载+合并
    # format: "best[height<=480]"  # 可选：完全自定义 yt-dlp -f，非空则覆盖上面规则

logging:
  level:
    root: INFO
    com.dwcode.okxbot: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
