# 核心启动配置。业务开关按模块拆在 config/ 下，本文件只 import。
# 密钥走环境变量（deploy/env/app.env）。
#   application-local.yml  — 本地覆盖（不提交）
#   application-ec2.yml    — 生产覆盖（提交）
#
# 模块：
#   config/auth.yml      认证 / 邮件 / OAuth
#   config/pay.yml       会员支付
#   config/ai.yml        对话 / 视频 / 文生图 / 文章提取
#   config/platform.yml  知识库 / 存储 / Halo / Horizon

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  config:
    import:
      - classpath:config/auth.yml
      - classpath:config/pay.yml
      - classpath:config/ai.yml
      - classpath:config/platform.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url / username / password → local 或 ec2 profile
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing schema at introduce flyway
    validate-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 120MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 勿用 stdout 打全量 SQL：知识库 LONGTEXT 会把接口拖到秒级
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.dwcode.okxbot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
