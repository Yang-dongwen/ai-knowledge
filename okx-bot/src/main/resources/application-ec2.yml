# EC2 / Docker 生产覆盖（profile: ec2）
# 默认值在 application.yml + config/{auth,pay,ai,platform}.yml
# 本文件只写和生产不同的项；密钥由 deploy/env/app.env 注入

server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
  mail:
    provider: agentmail
    console-mode: false
    from: dwcode@agentmail.to
    agentmail:
      api-key: ${AGENTMAIL_API_KEY:}
      inbox-id: ${AGENTMAIL_INBOX_ID:}
      base-url: https://api.agentmail.to
      proxy-host: ""
      proxy-port: 0
      proxy-type: HTTP
  admin:
    seed-enabled: false
    email: admin@okx-bot.local
    password: ${AUTH_ADMIN_PASSWORD}
  cors:
    allowed-origins:
      - https://dwcode.cloud
      - https://www.dwcode.cloud
  wechat:
    mini:
      enabled: true
      mock: false
      app-id: ${WX_MINI_APP_ID:}
      app-secret: ${WX_MINI_APP_SECRET:}
  oauth:
    mock: false
    auto-link-by-email: false
    frontend-base-url: https://dwcode.cloud
    callback-base-url: https://dwcode.cloud
    ticket-ttl-seconds: 60
    google:
      enabled: false
      client-id: ${AUTH_OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${AUTH_OAUTH_GOOGLE_CLIENT_SECRET:}
    github:
      enabled: true
      client-id: ${AUTH_OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${AUTH_OAUTH_GITHUB_CLIENT_SECRET:}

pay:
  public-base-url: https://dwcode.cloud
  trust-x-forwarded-for: true
  mock-enabled: false
  # 生产未配 Live 密钥前先关；沙箱开关在 config/pay.yml
  stripe:
    enabled: false

ai:
  default-provider: nvidia
  providers:
    openai:
      api-key: ${AI_OPENAI_API_KEY:}
    deepseek:
      api-key: ${AI_DEEPSEEK_API_KEY:}
    nvidia:
      api-key: ${AI_NVIDIA_API_KEY:}
  embedding:
    api-key: ${GOOGLE_AI_STUDIO_API_KEY:}
  vector-store:
    host: ${QDRANT_HOST:}
    api-key: ${QDRANT_API_KEY:}

storage:
  provider: r2
  env-prefix: ec2
  serve-mode: presign
  local:
    root: /app/data/_objects
  scratch:
    root: /app/data/_scratch
  r2:
    account-id: ${R2_ACCOUNT_ID}
    bucket: ${R2_BUCKET}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    endpoint: ${R2_ENDPOINT:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    region: auto
    path-style: true

video:
  work-dir: /app/data/video
  yt-dlp-path: yt-dlp
  ffmpeg-path: ffmpeg
  whisper:
    base-url: http://whisper:8000
    model: small
    managed:
      enabled: false
  download:
    cookies-file: ${VIDEO_COOKIES_FILE:}

aigen:
  work-dir: /app/data/aigen
  visual:
    bgm-dir: /app/data/aigen/_bgm
  remotion:
    base-url: http://remotion:3100
    manage-process: false
    auto-start-on-boot: false
  tts:
    provider: edge
    edge-command: edge-tts
    fail-open-to-mock: false

imggen:
  work-dir: /app/data/imggen

halo:
  enabled: true
  base-url: http://halo:8090
  token: ${HALO_PAT:}
  public-base-url: https://blog.dwcode.cloud

horizon:
  refresh-enabled: true
  auto-publish: true

article:
  safety:
    allow-loopback: false

logging:
  level:
    root: INFO
    com.dwcode.okxbot: INFO
    org.apache.ibatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/okx-bot.log
  logback:
    rollingpolicy:
      file-name-pattern: /app/logs/okx-bot.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 2GB
