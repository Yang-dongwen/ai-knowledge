# EC2 / Docker 生产配置 — 提交到 Git
# 密钥不写死，由服务器 deploy/env/app.env 注入环境变量
# profile: ec2
# R2 路径前缀 env-prefix=ec2（本地用 local）

server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
  mail:
    # 生产默认关 console，避免验证码进日志；需显式配真实 provider
    provider: ${AUTH_MAIL_PROVIDER:agentmail}
    console-mode: ${AUTH_MAIL_CONSOLE_MODE:false}
    from: ${AUTH_MAIL_FROM:noreply@example.com}
    agentmail:
      api-key: ${AGENTMAIL_API_KEY:}
      inbox-id: ${AGENTMAIL_INBOX_ID:}
      base-url: ${AGENTMAIL_BASE_URL:https://api.agentmail.to}
      # 生产一般直连；仅当出网需代理时再设
      proxy-host: ${AGENTMAIL_PROXY_HOST:}
      proxy-port: ${AGENTMAIL_PROXY_PORT:0}
      proxy-type: ${AGENTMAIL_PROXY_TYPE:HTTP}
  admin:
    # 完成首次 bootstrap 后应保持 false
    seed-enabled: ${AUTH_ADMIN_SEED_ENABLED:false}
    email: ${AUTH_ADMIN_EMAIL:admin@okx-bot.local}
    password: ${AUTH_ADMIN_PASSWORD}
  cors:
    allowed-origins:
      - https://dwcode.cloud
      - https://www.dwcode.cloud
  wechat:
    mini:
      # 生产默认开启真实微信登录；无密钥时可设 WX_MINI_ENABLED=false
      enabled: ${WX_MINI_ENABLED:true}
      mock: false
      app-id: ${WX_MINI_APP_ID:}
      app-secret: ${WX_MINI_APP_SECRET:}
  oauth:
    mock: ${AUTH_OAUTH_MOCK:false}
    auto-link-by-email: false
    frontend-base-url: ${AUTH_OAUTH_FRONTEND_BASE_URL:https://dwcode.cloud}
    callback-base-url: ${AUTH_OAUTH_CALLBACK_BASE_URL:https://dwcode.cloud}
    ticket-ttl-seconds: ${AUTH_OAUTH_TICKET_TTL_SECONDS:60}
    google:
      enabled: ${AUTH_OAUTH_GOOGLE_ENABLED:false}
      client-id: ${AUTH_OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${AUTH_OAUTH_GOOGLE_CLIENT_SECRET:}
    github:
      enabled: ${AUTH_OAUTH_GITHUB_ENABLED:false}
      client-id: ${AUTH_OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${AUTH_OAUTH_GITHUB_CLIENT_SECRET:}

pay:
  public-base-url: ${PAY_PUBLIC_BASE_URL}
  trust-x-forwarded-for: true
  mock-enabled: ${PAY_MOCK_ENABLED:false}

ai:
  default-provider: ${AI_DEFAULT_PROVIDER:nvidia}
  providers:
    openai:
      api-key: ${AI_OPENAI_API_KEY:}
    deepseek:
      api-key: ${AI_DEEPSEEK_API_KEY:}
    nvidia:
      api-key: ${AI_NVIDIA_API_KEY:}

storage:
  provider: r2
  env-prefix: ec2
  serve-mode: presign
  local:
    root: /app/data/_objects
  scratch:
    root: /app/data/_scratch
  r2:
    account-id: ${R2_ACCOUNT_ID}
    bucket: ${R2_BUCKET}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    endpoint: ${R2_ENDPOINT:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    region: auto
    path-style: true

video:
  work-dir: /app/data/video
  yt-dlp-path: yt-dlp
  ffmpeg-path: ffmpeg
  whisper:
    base-url: http://whisper:8000
    model: ${WHISPER_MODEL:small}
    managed:
      enabled: false
  download:
    cookies-file: ${VIDEO_COOKIES_FILE:}

aigen:
  work-dir: /app/data/aigen
  visual:
    bgm-dir: /app/data/aigen/_bgm
  remotion:
    base-url: http://remotion:3100
    manage-process: false
    auto-start-on-boot: false
  tts:
    provider: edge
    edge-command: edge-tts
    fail-open-to-mock: ${AIGEN_TTS_FAIL_OPEN_TO_MOCK:false}

imggen:
  work-dir: /app/data/imggen

article:
  safety:
    allow-loopback: false

logging:
  level:
    root: INFO
    com.dwcode.okxbot: INFO
    org.apache.ibatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/okx-bot.log
  logback:
    rollingpolicy:
      file-name-pattern: /app/logs/okx-bot.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 2GB
