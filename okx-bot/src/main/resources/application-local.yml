# 本地 IDE / mvn 启动专用：spring.profiles.active=local
# 与服务器生产 env 分离，避免连 RDS、用 Linux 路径导致起不来

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/okx_bot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

auth:
  mail:
    console-mode: true
  admin:
    seed-enabled: true
    email: admin@okx-bot.local
    password: Admin@123456

pay:
  public-base-url: http://127.0.0.1:8080
  mock-enabled: true

# 本地默认可 local；要测 R2 时在 app.env.local 设 STORAGE_PROVIDER=r2 及密钥
storage:
  provider: ${STORAGE_PROVIDER:local}
  env-prefix: ${STORAGE_ENV_PREFIX:dev}

video:
  work-dir: ./data/video
  # Windows 绝对路径优先用环境变量 VIDEO_*（见 deploy/app.env.local）
  yt-dlp-path: ${VIDEO_YT_DLP_PATH:yt-dlp}
  ffmpeg-path: ${VIDEO_FFMPEG_PATH:ffmpeg}
  whisper:
    managed:
      enabled: true
      working-dir: ./whisper-service

aigen:
  work-dir: ./data/aigen
  remotion:
    manage-process: true
    project-dir: ../aigen-remotion

imggen:
  work-dir: ./data/imggen

logging:
  level:
    com.dwcode.okxbot: DEBUG
