          description: The image height in pixels. Supported heights=[512,
            528, 544, 560, 576, 592, 608, 624, 640, 656, 672, 688, 704, 720, 736,
            752, 768, 784, 800, 816, 832, 848, 864, 880, 896, 912, 928, 944, 960,
            976, 992, 1008, 1024, 1040, 1056, 1072, 1088, 1104, 1120, 1136, 1152,
            1168, 1184, 1200, 1216, 1232, 1248, 1264, 1280, 1296, 1312, 1328, 1344,
            1360, 1376, 1392, 1408, 1424, 1440, 1456, 1472, 1488, 1504, 1520, 1536,
            1552, 1568, 1584, 1600, 1616, 1632, 1648, 1664]
