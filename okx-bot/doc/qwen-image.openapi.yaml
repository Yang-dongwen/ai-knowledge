openapi: 3.1.0
info:
  title: NVIDIA Visual Generative AI NIM for qwen/qwen-image
  version: 1.0.0
paths:
  /v1/health/live:
    get:
      summary: Service liveness check
      description: This endpoint will return a 200 status as soon as the service is
        able to accept traffic, but it does not mean the service is ready to accept
        inference requests.
      operationId: health_live_v1_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIMHealthSuccessResponse'
          description: Service is live
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIMErrorResponse'
          description: Service is not live
  /v1/health/ready:
    get:
      operationId: health_ready_v1_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIMHealthSuccessResponse'
          description: Service is ready
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIMErrorResponse'
          description: Service is not ready
      summary: Health Ready
  /v1/license:
    get:
      description: Handler for license endpoint.
      operationId: license_v1_license_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseEndpointModel'
          description: Successful Response
      summary: License
  /v1/manifest:
    get:
      description: Handler for the manifest endpoint.
      operationId: manifest_v1_manifest_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestEndpointModel'
          description: Successful Response
      summary: Manifest
  /v1/metadata:
    get:
      description: Handler for metadata endpoint.
      operationId: metadata_v1_metadata_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataEndpointModel'
          description: Successful Response
      summary: Metadata
  /v1/metrics:
    get:
      description: Handler for metrics endpoint.
      operationId: metrics_v1_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Metrics V1 Metrics Get
                type: string
          description: Successful Response
      summary: Metrics
  /v1/version:
    get:
      description: Handler for version endpoint.
      operationId: version_v1_version_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIMVersionResponse'
          description: Successful Response
      summary: Version
  /v1/infer:
    post:
      operationId: _infer_v1_infer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: ' Infer'
  /v1/images/generations:
    post:
      operationId: openai_generate_images_v1_images_generations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerationResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: OpenAI Compatible Image Generation Endpoint
components:
  schemas:
    Artifact:
      properties:
        base64:
          description: A base64-encoded string of the generated image (JPEG).
          examples:
          - /9j/4AAQSkZ...b+AVZ/9k=
          title: Base64
          type: string
        finishReason:
          $ref: '#/components/schemas/FinishReason'
          description: "The result of the generation process: `SUCCESS` when it completes successfully, `ERROR` when it encounters an issue, and `CONTENT_FILTERED` when the content filter alters the output."
        seed:
          description: The seed used during generation.
          title: Seed
          type: integer
      required:
      - base64
      - finishReason
      - seed
      title: Artifact
      type: object
    FinishReason:
      enum:
      - CONTENT_FILTERED
      - ERROR
      - SUCCESS
      title: FinishReason
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Image:
      description: Single generated image data
      properties:
        b64_json:
          description: The base64-encoded JSON of the generated image
          title: B64 Json
          type: string
      title: Image
      type: object
    ImageGenerationRequest:
      additionalProperties: false
      description: 'OpenAI compatible image generation request.
        Follows the OpenAI Images API specification with Visual GenAI NIM extensions for advanced diffusion parameters.'
      properties:
        prompt:
          description: A text description of the desired image.
          maxLength: 800
          minLength: 1
          title: Prompt
          type: string
        cfg_scale:
          anyOf:
          - exclusiveMinimum: 1.0
            maximum: 20.0
            type: number
          - type: 'null'
          default: 4.0
          description: How strictly the diffusion process adheres to the prompt text
            (higher values keep your image closer to your prompt).
          title: Cfg Scale
        negative_prompt:
          maxLength: 500
          type: string
          description: The negative text prompt for generation.
          title: Negative Prompt
        model:
          type: string
          description: The model to use for image generation (optional, uses server's
            configured model if omitted)
          title: Model
        n:
          default: 1
          description: Number of images to generate. Only n=1 is supported.
          maximum: 1.0
          minimum: 1.0
          title: N
          type: integer
        response_format:
          const: b64_json
          default: b64_json
          description: Format of the returned image. Only `b64_json` is supported
          title: Response Format
          type: string
        seed:
          exclusiveMaximum: 4294967296
          minimum: 0
          type: integer
          default: 0
          description: The seed which governs generation. Omit this option or use 0 for a random seed.
          title: Seed
        size:
          type: string
          description: Image dimensions in WIDTHxHEIGHT format (e.g., '1024x1024',
            uses model defaults if omitted)
          title: Size
        steps:
          maximum: 100.0
          minimum: 5.0
          type: integer
          default: 30
          description: Number of diffusion sampling steps (uses model defaults if not specified)
          title: Steps
        disable_safety_checker:
          type: boolean
          default: false
          description: If True disables safety checks of the generated images. This parameter is available only if the container is started with NIM_ALLOW_UNCHECKED_GENERATION=true
          title: Disable Safety Checker
      required:
      - prompt
      title: ImageGenerationRequest
      type: object
    ImageGenerationResponse:
      description: OpenAI compatible image generation response.
      properties:
        created:
          description: The Unix timestamp (in seconds) of when the image was created.
          title: Created
          type: integer
        data:
          description: The list of generated images.
          items:
            $ref: '#/components/schemas/Image'
          title: Data
          type: array
        output_format:
          description: The output format of the image generation.
          title: Output Format
          type: string
        size:
          description: The size of the image generated.
          title: Size
          type: string
      required:
      - created
      - data
      title: ImageGenerationResponse
      type: object
    ImageRequest:
      additionalProperties: false
      properties:
        prompt:
          description: The text prompt to use for generation.
          maxLength: 800
          minLength: 1
          type: string
          title: Prompt
        cfg_scale:
          exclusiveMinimum: 1.0
          maximum: 20.0
          type: number
          default: 4.0
          description: How strictly the diffusion process adheres to the prompt text
            (higher values keep your image closer to your prompt).
          title: Cfg Scale
        disable_safety_checker:
          type: boolean
          default: false
          description: Set this to True to disable safety checks on the generated images. This parameter is available only if the container is started with NIM_ALLOW_UNCHECKED_GENERATION=true
          title: Disable Safety Checker
        height:
          enum:
          - 512
          - 528
          - 544
