          ge: 512
          le: 1664
          type: integer
          default: 1024
          description: The image width in pixels. Supported widths=[512,
            528, 544, 560, 576, 592, 608, 624, 640, 656, 672, 688, 704, 720, 736,
            752, 768, 784, 800, 816, 832, 848, 864, 880, 896, 912, 928, 944, 960,
            976, 992, 1008, 1024, 1040, 1056, 1072, 1088, 1104, 1120, 1136, 1152,
            1168, 1184, 1200, 1216, 1232, 1248, 1264, 1280, 1296, 1312, 1328, 1344,
            1360, 1376, 1392, 1408, 1424, 1440, 1456, 1472, 1488, 1504, 1520, 1536,
            1552, 1568, 1584, 1600, 1616, 1632, 1648, 1664]
          title: Width
        image:
          anyOf:
          - type: string
          - type: 'null'
          description: Image input is not supported in the current version. Only `null`
            value is accepted.
          title: Image
        negative_prompt:
          maxLength: 500
          type: string
          description: The negative text prompt for generation.
          title: Negative Prompt
        samples:
          maximum: 1.0
          minimum: 1.0
          type: integer
          default: 1
          description: Number of images to generate. Only samples=1 is supported.
          title: Samples
        seed:
          exclusiveMaximum: 4294967296
          minimum: 0
          type: integer
          default: 0
          description: The seed which governs generation. Omit this option or use 0 for a random seed.
          title: Seed
        steps:
          maximum: 100.0
          minimum: 5.0
          type: integer
          default: 30
          description: Number of diffusion steps to run.
          title: Steps
      required:
      - prompt
      title: ImageRequest
      type: object
    ImageResponse:
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/Artifact'
          maxItems: 1
          minItems: 1
          title: Artifacts
          type: array
      required:
      - artifacts
      title: ImageResponse
      type: object
    LicenseEndpointModel:
      description: A model representing the license response.
      properties:
        content:
          description: The license text.
          title: Content
          type: string
        name:
          description: The name of the license for the NIM container.
          title: Name
          type: string
        path:
          description: The filepath within the container containing the license content.
          title: Path
          type: string
        sha:
          description: A SHA1 hash of the license contents.
          title: Sha
          type: string
        size:
          description: The number of characters in the license content.
          title: Size
          type: integer
        type:
          const: file
          description: The format of the license content.
          title: Type
          type: string
        url:
          description: The url where this license is hosted externally.
          title: Url
          type: string
      required:
      - name
      - path
      - sha
      - size
      - url
      - type
      - content
      title: LicenseEndpointModel
      type: object
    ManifestEndpointModel:
      description: A model representing the manifest response.
      properties:
        manifest_file:
          description: The content of the manifest file describing the required model
            artifacts.
          title: Manifest File
          type: string
        repository_override:
          description: Alternate location used to retrieve artifacts from manifest
            file.
          title: Repository Override
          type: string
      required:
      - manifest_file
      - repository_override
      title: ManifestEndpointModel
      type: object
    MetadataEndpointModel:
      description: A model representing the metadata response.
      properties:
        assetInfo:
          description: A list of required container assets excluding model artifacts
          items:
            type: string
          title: Assetinfo
          type: array
        licenseInfo:
          $ref: '#/components/schemas/LicenseEndpointModel'
          description: The license info.
        modelInfo:
          description: A list of models being served by the NIM.
          items:
            $ref: '#/components/schemas/ModelInfo'
          title: Modelinfo
          type: array
        repository_override:
          description: Alternate location used to retrieve artifacts from manifest
            file.
          title: Repository Override
          type: string
        selectedModelProfileId:
          description: The ID of the currently selected model profile.
          title: Selectedmodelprofileid
          type: string
        version:
          description: The version of the NIM service.
          title: Version
          type: string
      required:
      - assetInfo
      - licenseInfo
      - modelInfo
      - repository_override
      - version
      - selectedModelProfileId
      title: MetadataEndpointModel
      type: object
    ModelInfo:
      description: A model representing the model response.
      properties:
        modelUrl:
          title: Modelurl
          type: string
        shortName:
          title: Shortname
          type: string
      required:
      - modelUrl
      - shortName
      title: ModelInfo
      type: object
    NIMErrorResponse:
      description: Error response model.
      properties:
        error:
          additionalProperties: true
          description: Error details
          title: Error
          type: object
      required:
      - error
      title: NIMErrorResponse
      type: object
    NIMHealthSuccessResponse:
      description: A model representing the health success response.
      properties:
        message:
          description: The message of the health response.
          title: Message
          type: string
        object:
          default: health.response
          description: The object of the health response.
          title: Object
          type: string
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: The status of the health response for backwards compatibility.
          title: Status
      required:
      - message
      title: NIMHealthSuccessResponse
      type: object
    NIMVersionResponse:
      description: A model representing versions of the NIM
      properties:
        api:
          description: The server API version running inside the NIM.
          title: Api
          type: string
        release:
          description: The product release version of NIM for LLMs.
          title: Release
          type: string
      required:
      - release
      - api
      title: NIMVersionResponse
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
